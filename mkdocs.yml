site_name: qte77-claude-code-plugins
site_description: Claude Code plugin marketplace — skills, agents, and hooks from production workflows.
repo_url: https://github.com/qte77/claude-code-plugins
repo_name: qte77/claude-code-plugins

theme:
  name: material

# No `nav:` — generated from docs/ so new plugins appear without edits.
# README, CHANGELOG, LICENSE and plugins/*/README.md are staged into docs/ by `make docs_stage`.
exclude_docs: |
  plans/
