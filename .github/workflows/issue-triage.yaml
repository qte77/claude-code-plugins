# AI-powered issue triage via qte77/gha-issue-triage. Fires on every new,
# edited, or reopened issue. Detects duplicates, scores relevance against
# the repo's scope (README/AGENTS), analyzes feasibility + complexity,
# auto-labels, and posts a single sticky summary comment that is edited
# in place on re-runs.
#
# Backend: Cloudflare Workers AI via its OpenAI-compatible endpoint (GitHub
# Models was retired 2026-07-30). Needs repo secrets CF_WORKERS_AI_TOKEN and
# LLM_BASE_URL (https://api.cloudflare.com/client/v4/accounts/<id>/ai/v1).
# GH_TOKEN is only used for issue/label calls; no `models: read` needed.
#
# Security note: no `run:` steps consume issue-controlled fields. The only
# template expressions used are `github.event.issue.number` (numeric, safe
# to interpolate in the concurrency key) and the secrets `GITHUB_TOKEN`,
# `CF_WORKERS_AI_TOKEN` and `LLM_BASE_URL`, passed as action inputs. All
# issue body/title parsing happens inside the pinned action; since v0.5.0 its
# public comment shows only fixed-list values, never model free text.
name: issue-triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  # One in-flight triage per issue so a quick edit doesn't race with the
  # initial open and stack two summary comments before the sticky-edit
  # logic kicks in. `issue.number` is numeric — safe to interpolate.
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: qte77/gha-issue-triage@f7254d606bd002343b73190706b46f43b645f912  # v0.5.0
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.CF_WORKERS_AI_TOKEN }}
          api_base: ${{ secrets.LLM_BASE_URL }}
          MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
